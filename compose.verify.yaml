services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image:
      odoo-agile-delivery-verify:${VERIFY_IMAGE_TAG:?Run scripts/verify to set the
      checkout image tag}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./scripts/probes:/mnt/policy-tests:ro

# Verification has DB/loopback connectivity only; provider/network calls cannot
# become an accidental runtime requirement. This is not a live Odoo.sh fixture.
networks:
  default:
    internal: true
