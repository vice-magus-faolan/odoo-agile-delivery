name: CI

on:
  pull_request:
    branches: ["19.0"]
  push:
    branches: ["19.0"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lint entrypoint
        run: python -m pip install -r requirements-lint.txt
      - name: Install pinned Pandoc for README generation
        env:
          PANDOC_VERSION: "3.12.1"
          PANDOC_SHA256: "d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pandoc.tar.gz"
          install_dir="$RUNNER_TEMP/pandoc"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz"
          printf "%s  %s\n" "$PANDOC_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" \
            --strip-components=1 --directory "$install_dir"
          version=$("$install_dir/bin/pandoc" --version)
          printf "%s\n" "$version"
          test "${version%%$'\n'*}" = "pandoc $PANDOC_VERSION"
          printf "%s\n" "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Validate configuration and run all-files hooks
        run: |
          pre-commit validate-config
          pre-commit run --all-files --show-diff-on-failure

  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          # PR comparison and populated upgrade both require source history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical native Odoo verification
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            timeout 3600 ./scripts/verify --pr "$PR_BASE" "$GITHUB_SHA" > verification.log 2>&1
          else
            timeout 3600 ./scripts/verify > verification.log 2>&1
          fi
      - name: Retain native verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-odoo-verification
          path: verification.log
          if-no-files-found: error
          retention-days: 7
