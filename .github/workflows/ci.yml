name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lint entrypoint
        run: python -m pip install -r requirements-lint.txt
      - name: Validate configuration and run all-files hooks
        run: |
          pre-commit validate-config
          pre-commit run --all-files --show-diff-on-failure

  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical native Odoo verification
        run: timeout 3600 ./scripts/verify > verification.log 2>&1
      - name: Retain native results and owned teardown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-odoo-verification
          path: verification.log
          if-no-files-found: error
          retention-days: 7
