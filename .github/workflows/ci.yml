name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lint entrypoint
        run: python -m pip install -r requirements-lint.txt
      - name: Validate configuration and run all-files hooks
        run: |
          pre-commit validate-config
          pre-commit run --all-files --show-diff-on-failure

  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # PR comparison and populated upgrade both require source history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical native Odoo verification
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            timeout 3600 ./scripts/verify --pr "$PR_BASE" "$PR_HEAD" > verification.log 2>&1
          else
            timeout 3600 ./scripts/verify > verification.log 2>&1
          fi
      - name: Retain native results and owned teardown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-odoo-verification
          path: verification.log
          if-no-files-found: error
          retention-days: 7
